services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: diseasegraph
      POSTGRES_USER: diseasegraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${STAGING_POSTGRES_PORT:-25432}:5432"
    volumes:
      - top10kg_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diseasegraph -d diseasegraph"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:${STAGING_NEO4J_HTTP_PORT:-27474}:7474"
      - "127.0.0.1:${STAGING_NEO4J_BOLT_PORT:-27687}:7687"
    volumes:
      - top10kg_staging_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  top10kg_staging_postgres:
  top10kg_staging_neo4j:
